<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>vishwa@portfolio: ~ — tty1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=VT323&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0d0a;
      --bg-deep: #050605;
      --fg: #e8c468;
      --fg-bright: #ffd97a;
      --fg-dim: #8a7548;
      --accent: #6abf69;
      --accent-2: #5fb3d4;
      --error: #ff6b5e;
      --warn: #ffcc66;
      --border: #2a2a20;
      --cursor: #ffd97a;
    }

    body.theme-amber {
      --bg: #0a0d0a;
      --bg-deep: #050605;
      --fg: #e8c468;
      --fg-bright: #ffd97a;
      --fg-dim: #8a7548;
      --accent: #6abf69;
      --accent-2: #5fb3d4;
      --error: #ff6b5e;
      --cursor: #ffd97a;
      --border: #2a2a20;
    }

    body.theme-green {
      --bg: #050a05;
      --bg-deep: #020402;
      --fg: #33ff66;
      --fg-bright: #aaffbb;
      --fg-dim: #1a8033;
      --accent: #ffcc33;
      --accent-2: #66ddff;
      --error: #ff5555;
      --cursor: #aaffbb;
      --border: #103a18;
    }

    body.theme-cyan {
      --bg: #04101a;
      --bg-deep: #02080e;
      --fg: #5fe0e0;
      --fg-bright: #a0f5f5;
      --fg-dim: #2a8088;
      --accent: #ff9966;
      --accent-2: #ffcc66;
      --error: #ff6b9e;
      --cursor: #a0f5f5;
      --border: #0a3040;
    }

    body.theme-locked {
      --bg: #000000;
      --bg-deep: #000000;
      --fg: #00ff00;
      --fg-bright: #00ff00;
      --fg-dim: #008800;
      --accent: #00ff00;
      --accent-2: #00ff00;
      --error: #ff0000;
      --cursor: #00ff00;
      --border: #004400;
    }

    body.theme-locked .bezel {
      background: #000;
    }

    body.theme-locked .screen {
      box-shadow: inset 0 0 100px rgba(0, 255, 0, 0.1), 0 0 50px rgba(0, 255, 0, 0.1);
    }

    body.theme-locked .titlebar {
      background: #0a0a0a;
      border-bottom: 1px solid #004400;
    }

    body.theme-locked .titlebar-title {
      color: #008800;
    }

    body.theme-locked .statusbar {
      background: #050505;
      border-top: 1px solid #004400;
    }

    body.theme-locked .tb-btn.close {
      background: #333;
    }

    body.theme-locked .tb-btn.min {
      background: #333;
    }

    body.theme-locked .tb-btn.max {
      background: #333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      color: var(--fg);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .hidden-input {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: none;
      background: transparent;
      color: transparent;
      font-size: 16px;
      caret-color: transparent;
      z-index: -1;
    }

    .bezel {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, #1a1a1a 0%, #050505 70%), #000;
      padding: 18px;
      display: flex;
    }

    .screen {
      flex: 1;
      background: var(--bg);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      box-shadow:
        inset 0 0 60px rgba(0, 0, 0, 0.7),
        inset 0 0 240px rgba(232, 196, 104, 0.04),
        0 0 0 1px rgba(255, 255, 255, 0.06),
        0 0 60px rgba(0, 0, 0, 0.6),
        0 20px 80px rgba(0, 0, 0, 0.8);
      animation: warmup 1.5s ease-out;
    }

    @keyframes warmup {
      0% {
        opacity: 0;
        filter: brightness(0.2) contrast(0.5);
      }

      40% {
        opacity: 1;
        filter: brightness(1.4) contrast(1.1);
      }

      55% {
        filter: brightness(0.85) contrast(1);
      }

      100% {
        opacity: 1;
        filter: brightness(1) contrast(1);
      }
    }

    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.22) 3px, rgba(0, 0, 0, 0.22) 4px);
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s;
    }

    .scanlines.off {
      opacity: 0;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.55) 100%);
      pointer-events: none;
      z-index: 11;
    }

    .flicker {
      position: absolute;
      inset: 0;
      background: rgba(255, 217, 122, 0.025);
      pointer-events: none;
      z-index: 12;
      animation: flicker 6s infinite;
      mix-blend-mode: screen;
    }

    body.theme-locked .flicker {
      background: rgba(0, 255, 0, 0.05);
    }

    @keyframes flicker {

      0%,
      96%,
      100% {
        opacity: 0.5;
      }

      97% {
        opacity: 0.2;
      }

      97.5% {
        opacity: 0.8;
      }

      98% {
        opacity: 0.3;
      }

      99% {
        opacity: 0.6;
      }
    }

    .phosphor-hum {
      position: absolute;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255, 217, 122, 0.02) 50%, transparent 100%);
      pointer-events: none;
      z-index: 13;
      animation: hum 10s linear infinite;
    }

    body.theme-locked .phosphor-hum {
      background: linear-gradient(to bottom, transparent 0%, rgba(0, 255, 0, 0.05) 50%, transparent 100%);
    }

    @keyframes hum {
      from {
        transform: translateY(-100px);
      }

      to {
        transform: translateY(120vh);
      }
    }

    .titlebar {
      position: relative;
      height: 28px;
      background: linear-gradient(180deg, #1a1a14 0%, #0a0a06 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 11px;
      color: var(--fg-dim);
      z-index: 5;
      letter-spacing: 0.4px;
    }

    .titlebar-buttons {
      display: flex;
      gap: 6px;
      margin-right: 12px;
    }

    .tb-btn {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.5);
    }

    .tb-btn.close {
      background: #ff5e5e;
    }

    .tb-btn.min {
      background: #ffbd2e;
    }

    .tb-btn.max {
      background: #28ca42;
    }

    .titlebar-title {
      flex: 1;
      text-align: center;
    }

    .titlebar-info {
      width: 56px;
      text-align: right;
      font-size: 10px;
    }

    .terminal {
      position: relative;
      width: 100%;
      height: calc(100% - 28px - 22px);
      overflow-y: auto;
      padding: 14px 22px 24px;
      z-index: 1;
      text-shadow: 0 0 1px rgba(232, 196, 104, 0.3);
    }

    body.theme-locked .terminal {
      text-shadow: 0 0 2px rgba(0, 255, 0, 0.5);
    }

    .terminal::-webkit-scrollbar {
      width: 6px;
    }

    .terminal::-webkit-scrollbar-track {
      background: transparent;
    }

    .terminal::-webkit-scrollbar-thumb {
      background: rgba(232, 196, 104, 0.18);
      border-radius: 3px;
    }

    .terminal::-webkit-scrollbar-thumb:hover {
      background: rgba(232, 196, 104, 0.35);
    }

    .output {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .output-line {
      margin: 0;
      min-height: 1.4em;
      animation: lineFade 0.18s ease-out;
    }

    @keyframes lineFade {
      from {
        opacity: 0.2;
        transform: translateX(-2px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .prompt-line {
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .prompt-prefix {
      display: inline;
    }

    .prompt-user {
      color: var(--accent);
      font-weight: 500;
    }

    .prompt-host {
      color: var(--accent-2);
      font-weight: 500;
    }

    .prompt-path {
      color: var(--fg-bright);
      font-weight: 500;
    }

    .prompt-sep {
      color: var(--fg-dim);
    }

    .prompt-guest {
      color: var(--fg-bright);
      font-weight: 500;
    }

    .input-area {
      display: inline;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .input-text {
      color: var(--fg);
    }

    .ghost-text {
      color: var(--fg-dim);
      opacity: 0.55;
      font-style: italic;
      animation: ghostFlicker 0.4s ease-out;
    }

    @keyframes ghostFlicker {
      0% {
        opacity: 0;
      }

      30% {
        opacity: 0.8;
      }

      60% {
        opacity: 0.4;
      }

      100% {
        opacity: 0.55;
      }
    }

    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1.15em;
      background: var(--cursor);
      vertical-align: text-bottom;
      margin-left: 1px;
      margin-bottom: -2px;
      animation: blink 1.06s steps(1) infinite;
      box-shadow: 0 0 6px rgba(255, 217, 122, 0.5);
    }

    body.theme-locked .cursor {
      box-shadow: 0 0 8px rgba(0, 255, 0, 0.8);
    }

    @keyframes blink {

      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0;
      }
    }

    .text-error {
      color: var(--error);
    }

    .text-success {
      color: var(--accent);
    }

    .text-info {
      color: var(--accent-2);
    }

    .text-dim {
      color: var(--fg-dim);
    }

    .text-bright {
      color: var(--fg-bright);
      font-weight: 500;
    }

    .text-warn {
      color: var(--warn);
    }

    .text-bold {
      font-weight: 700;
    }

    .guess-line {
      color: var(--fg-bright);
      font-weight: bold;
      letter-spacing: 6px;
      padding-left: 8px;
      font-size: 1.1em;
    }

    .result-line {
      color: var(--accent);
      letter-spacing: 6px;
      padding-left: 8px;
      font-size: 1.1em;
    }

    .md {
      margin: 6px 0 10px;
      padding: 4px 0 4px 18px;
      border-left: 1px solid var(--border);
      max-width: 100%;
    }

    .md h1 {
      color: var(--fg-bright);
      font-size: 1.4em;
      font-weight: 700;
      margin: 14px 0 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.3px;
      text-shadow: 0 0 6px rgba(255, 217, 122, 0.25);
    }

    .md h2 {
      color: var(--accent);
      font-size: 1.15em;
      font-weight: 700;
      margin: 14px 0 4px;
    }

    .md h3 {
      color: var(--accent-2);
      font-size: 1em;
      font-weight: 700;
      margin: 10px 0 4px;
    }

    .md p {
      margin: 6px 0;
      line-height: 1.65;
      color: var(--fg);
    }

    .md code {
      background: rgba(232, 196, 104, 0.1);
      color: var(--fg-bright);
      padding: 1px 5px;
      border-radius: 2px;
      font-size: 0.95em;
    }

    .md pre {
      background: var(--bg-deep);
      border: 1px solid var(--border);
      padding: 10px 14px;
      margin: 10px 0;
      overflow-x: auto;
      border-radius: 2px;
    }

    .md pre code {
      background: none;
      color: var(--fg);
      padding: 0;
      font-size: 0.95em;
      display: block;
      white-space: pre;
    }

    .md ul,
    .md ol {
      margin: 6px 0;
      padding-left: 24px;
    }

    .md li {
      margin: 3px 0;
      line-height: 1.6;
    }

    .md a {
      color: var(--accent-2);
      text-decoration: underline;
      text-decoration-style: dotted;
    }

    .md a:hover {
      color: var(--fg-bright);
    }

    .md blockquote {
      border-left: 3px solid var(--accent);
      padding: 2px 0 2px 12px;
      color: var(--fg-dim);
      margin: 8px 0;
      font-style: italic;
    }

    .md hr {
      border: none;
      border-top: 1px dashed var(--border);
      margin: 12px 0;
    }

    .md strong {
      color: var(--fg-bright);
      font-weight: 700;
    }

    .md em {
      color: var(--accent);
    }

    .md .meta {
      color: var(--fg-dim);
      font-size: 0.9em;
      font-style: italic;
      margin-bottom: 8px;
    }

    .man-page {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      margin: 8px 0;
      animation: manScroll 0.7s ease-out;
      white-space: normal;
    }

    @keyframes manScroll {
      from {
        clip-path: inset(0 0 100% 0);
        opacity: 0.6;
      }

      to {
        clip-path: inset(0 0 0 0);
        opacity: 1;
      }
    }

    .man-header {
      text-align: center;
      color: var(--fg-bright);
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 1px;
      font-size: 0.95em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .man-section {
      color: var(--accent);
      font-weight: 700;
      margin: 12px 0 4px;
      text-transform: uppercase;
      font-size: 0.95em;
      letter-spacing: 1px;
    }

    .man-entry {
      margin: 3px 0;
      padding-left: 18px;
      text-indent: -18px;
      line-height: 1.6;
    }

    .man-cmd {
      color: var(--fg-bright);
      font-weight: 700;
    }

    .man-footer {
      text-align: center;
      color: var(--fg-dim);
      font-size: 0.9em;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      letter-spacing: 0.5px;
    }

    .ls-listing {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 2px 24px;
      margin: 4px 0;
      white-space: normal;
    }

    .ls-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 1px 0;
    }

    .ls-item .ls-icon {
      width: 1.2em;
      flex-shrink: 0;
    }

    .ls-item.dir {
      color: var(--accent);
      font-weight: 500;
    }

    .ls-item.file {
      color: var(--fg);
    }

    .ls-item.markdown {
      color: var(--fg-bright);
    }

    .ls-item.readme {
      color: var(--accent);
      font-weight: 500;
    }

    .ls-long {
      display: grid;
      grid-template-columns: auto auto auto auto 1fr;
      gap: 4px 18px;
      margin: 4px 0;
      font-size: 0.95em;
      white-space: normal;
    }

    .ls-long .ls-perms {
      color: var(--accent-2);
    }

    .ls-long .ls-size {
      color: var(--fg-dim);
      text-align: right;
    }

    .ls-long .ls-date {
      color: var(--fg-dim);
    }

    .ls-long .ls-name {
      color: var(--fg);
    }

    .ls-long .ls-name.dir {
      color: var(--accent);
      font-weight: 500;
    }

    .ls-long .ls-name.markdown {
      color: var(--fg-bright);
    }

    .statusbar {
      height: 22px;
      background: var(--bg-deep);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      font-size: 10px;
      color: var(--fg-dim);
      z-index: 5;
      letter-spacing: 0.5px;
    }

    .statusbar-section {
      padding: 0 12px;
      height: 100%;
      display: flex;
      align-items: center;
      border-right: 1px solid var(--border);
      white-space: nowrap;
    }

    .statusbar-section:last-child {
      border-right: none;
      margin-left: auto;
    }

    .sb-label {
      color: var(--accent);
      margin-right: 4px;
      font-weight: 700;
    }

    .composer {
      border: 1px solid var(--border);
      margin: 8px 0;
      background: rgba(0, 0, 0, 0.4);
      padding: 0;
      animation: lineFade 0.3s ease-out;
    }

    .composer-header {
      background: var(--border);
      padding: 4px 12px;
      font-size: 0.9em;
      color: var(--accent);
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      letter-spacing: 0.5px;
    }

    .composer-body {
      padding: 12px 14px;
    }

    .composer-field {
      display: flex;
      align-items: center;
      margin: 5px 0;
    }

    .composer-label {
      width: 80px;
      color: var(--accent-2);
      flex-shrink: 0;
      font-weight: 500;
    }

    .composer-input,
    .composer-textarea {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px dashed var(--border);
      outline: none;
      color: var(--fg);
      font-family: inherit;
      font-size: inherit;
      padding: 2px 4px;
    }

    .composer-input:focus,
    .composer-textarea:focus {
      border-bottom-color: var(--accent);
    }

    .composer-textarea {
      resize: vertical;
      min-height: 80px;
      border: 1px dashed var(--border);
      margin-top: 4px;
      line-height: 1.5;
    }

    .composer-actions {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .composer-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 14px;
      font-family: inherit;
      font-size: 0.92em;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
      letter-spacing: 0.5px;
    }

    .composer-btn:hover:not(:disabled) {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 0 8px rgba(106, 191, 105, 0.4);
    }

    .composer-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .composer-btn.secondary {
      border-color: var(--fg-dim);
      color: var(--fg-dim);
    }

    .composer-btn.secondary:hover:not(:disabled) {
      background: var(--fg-dim);
      color: var(--bg);
      box-shadow: none;
    }

    .composer-hint {
      color: var(--fg-dim);
      font-size: 0.85em;
      font-style: italic;
    }

    .neofetch {
      display: flex;
      gap: 28px;
      margin: 8px 0;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .neofetch-ascii {
      color: var(--accent);
      font-size: 11px;
      line-height: 1.15;
      white-space: pre;
      text-shadow: 0 0 6px rgba(106, 191, 105, 0.4);
    }

    .neofetch-info {
      flex: 1;
      min-width: 220px;
    }

    .neofetch-info .nf-label {
      color: var(--accent);
      font-weight: 700;
    }

    .neofetch-info .nf-sep {
      color: var(--fg-dim);
      margin: 0 6px;
    }

    .neofetch-info .nf-line {
      margin: 2px 0;
    }

    .neofetch-colors {
      display: grid;
      grid-template-columns: repeat(8, 14px);
      gap: 2px;
      margin-top: 10px;
    }

    .neofetch-color {
      width: 14px;
      height: 14px;
      border-radius: 2px;
    }

    .ascii-banner {
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.1;
      font-size: 10px;
      white-space: pre;
      text-shadow: 0 0 8px rgba(106, 191, 105, 0.4);
      margin: 8px 0;
    }

    @keyframes flickerHard {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
        filter: brightness(1);
      }

      10%,
      30%,
      50%,
      70%,
      90% {
        opacity: 0;
        transform: scale(1.02);
        filter: brightness(3);
      }

      20%,
      40%,
      60%,
      80% {
        opacity: 1;
        transform: scale(1);
        filter: brightness(0.5);
      }
    }

    .flicker-hard .screen {
      animation: flickerHard 0.4s ease-out;
    }

    /* Spotify Media Player Styles */
    .music-player {
      display: flex;
      gap: 24px;
      border: 1px solid var(--accent);
      padding: 16px;
      margin: 8px 0;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.3);
    }

    .lyrics-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 140px;
    }

    .info-pane {
      width: 400px;
      border-left: 1px dashed var(--border);
      padding-left: 20px;
      display: flex;
      flex-direction: column;

    function cmdLs(args) {

      else files = getFilesInCwd();
      if (files.length === 0) { print('<span class="text-dim">(empty)</span>'); return; }
      if (long) {
        printRaw('<div class="ls-long">' + files.map(f => {
          const isDir = f.name.endsWith('/'); const perms = isDir ? 'drwxr-xr-x' : '-rw-r--r--';
          const size = isDir ? '4096' : String(Math.floor(Math.random() * 8) + 1) + 'K'; const date = f.date || '2025-08-01';
          const nameClass = isDir ? 'dir' : (f.kind === 'markdown' || f.kind === 'readme' ? 'markdown' : '');

      } else {
        printRaw('<div class="ls-listing">' + files.map(f => {

      const toInput = document.getElementById('cmp-to'); const subjectInput = document.getElementById('cmp-subject');
      const bodyInput = document.getElementById('cmp-body'); const fromInput = document.getElementById('cmp-from');
      setTimeout(() => { if (toInput) toInput.focus(); }, 80);
      function doSend() {
        const to = toInput.value.trim(); const subject = subjectInput.value.trim() || '(no subject)';
        const body = bodyInput.value.trim(); const from = fromInput.value.trim();
        if (!to) { print('<span class="text-error">mail: no recipient specified</span>'); return; }
        const params = new URLSearchParams();
        if (subject) params.set('subject', subject);
        if (body) params.set('body', body + (from ? '\n\n— ' + from : ''));
        const mailtoUrl = `mailto:${to}?${params.toString()}`;
        print(`<span class="text-success">↗ opening mail client for ${escapeHtml(to)}...</span>`);
        print(`<span class="text-dim">subject: ${escapeHtml(subject)}</span>`);
        try { window.location.href = mailtoUrl; } catch (e) { window.open(mailtoUrl, '_blank'); }
        if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = 'Sent ✓'; }
        if (cancelBtn) cancelBtn.disabled = true;
      }
      function doCancel() {
        if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = 'Cancelled'; }
        if (cancelBtn) cancelBtn.disabled = true;
        print('<span class="text-dim">— composer dismissed —</span>');
      }
      if (sendBtn) sendBtn.addEventListener('click', doSend);
      if (cancelBtn) cancelBtn.addEventListener('click', doCancel);
      [toInput, subjectInput, bodyInput, fromInput].forEach(inp => {
        if (!inp) return;
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); doCancel(); }
          else if (e.ctrlKey && (e.key === 'x' || e.key === 'X')) { e.preventDefault(); e.stopPropagation(); doSend(); }
        });
      });
    }

    // ----- Spotify Music Command (with precise sync logic) -----

    async function cmdMusic() {
      if (state.musicPoll) clearInterval(state.musicPoll);
      if (state.musicTick) clearInterval(state.musicTick);
      if (state.musicEq) clearInterval(state.musicEq);
      if (state.musicCassette) clearInterval(state.musicCassette);
      if (state.musicIdleTimer) clearTimeout(state.musicIdleTimer);
      state.musicPoll = state.musicTick = state.musicEq = state.musicCassette = null;
      state.musicIdleTimer = null;
      state.lyricsData = null;
      state.lastLyricIdx = -1;

      const musicId = `music-${Date.now()}`;
      let currentTrack = null;
      let lyricsRequestId = 0; // guards against stale/out-of-order lyrics responses
      let isIdle = false;
      let trackProfile = { energy: 0.6, pulseMs: 150 }; // simulated per-track "feel", replaced on track change
      const IDLE_THRESHOLD_MS = 90 * 1000; // dim the panel after 90s with nothing playing

      const fmtTime = (ms) => {
        if (!Number.isFinite(ms) || ms < 0) ms = 0;
        const min = Math.floor(ms / 60000);
        const sec = Math.floor((ms % 60000) / 1000);
        return `${min}:${sec.toString().padStart(2, '0')}`;
      };

      // Scrub-line style: played track as a heavy line, a cursor dot at the current
      // position, and unplayed track as light dots - reads more like a DAW timeline
      // than a loading bar.
      const progressBar = (rawPct) => {
        const totalBlocks = 16;
        // Clamp so a stray >1 (Spotify drift, seeking) never produces a bad index
        const pct = Math.max(0, Math.min(1, Number.isFinite(rawPct) ? rawPct : 0));
        const pos = Math.round(pct * (totalBlocks - 1));
        let bar = '';
        for (let i = 0; i < totalBlocks; i++) {
          if (i < pos) bar += '━';
          else if (i === pos) bar += '●';
          else bar += '·';
        }
        return bar;
      };

      // Deterministic per-track "feel" - NOT real Spotify audio data. Spotify locked
      // audio-features/audio-analysis (real energy/tempo) behind extended-quota access
      // in Nov 2024 and isn't granting that to new individual-dev apps, so this isn't
      // available to us. Instead we hash the track+artist into a stable seed so each
      // song consistently gets its own simulated energy/pulse-speed instead of every
      // song looking like identical random noise.
      function seededRng(seedStr) {
        let h = 1779033703 ^ seedStr.length;
        for (let i = 0; i < seedStr.length; i++) {
          h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
          h = (h << 13) | (h >>> 19);
        }
        return function () {
          h = Math.imul(h ^ (h >>> 16), 2246822507);
          h = Math.imul(h ^ (h >>> 13), 3266489909);
          h ^= h >>> 16;
          return (h >>> 0) / 4294967296;
        };
      }

      function getTrackProfile(track, artist) {
        const rng = seededRng(`${track}::${artist}`);
        const energy = 0.35 + rng() * 0.6; // 0.35 - 0.95, biases how "tall" the EQ runs
        const simulatedBpm = 78 + Math.floor(rng() * 90); // 78 - 168, purely simulated
        const pulseMs = Math.max(90, Math.min(320, Math.round(30000 / simulatedBpm)));
        return { energy, pulseMs };
      }

      // LRC Parser: Converts [00:12.34] Text -> { time: 12.34, text: 'Text' }
      function parseLRC(lrc) {
        if (!lrc) return null;
        const lines = lrc.split('\n');
        const parsed = [];
        const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
        for (const line of lines) {
          const match = line.match(regex);
          if (match) {
            const min = parseInt(match[1]);
            const sec = parseInt(match[2]);
            const ms = parseInt(match[3]);
            const time = min * 60 + sec + ms / 1000;
            const text = match[4].trim();
            if (text) parsed.push({ time, text });
          }
        }
        return parsed.length > 0 ? parsed : null;
      }

      // Karaoke Renderer
      function renderLyrics(currentMs) {
        if (!state.lyricsData) return;
        const sec = currentMs / 1000;
        let currIdx = -1;

        for (let i = 0; i < state.lyricsData.length; i++) {
          if (sec >= state.lyricsData[i].time) {
            currIdx = i;
          } else {
            break;
          }
        }

        if (currIdx !== state.lastLyricIdx) {
          state.lastLyricIdx = currIdx;
          const el = document.getElementById(`${musicId}-lyrics`);
          if (!el) return;

          let html = '';
          if (currIdx > 0) html += `<div class="lyric-prev">${escapeHtml(state.lyricsData[currIdx - 1].text)}</div>`;
          if (currIdx >= 0) {
            html += `<div class="lyric-curr">▶ ${escapeHtml(state.lyricsData[currIdx].text)}</div>`;
          } else {
            html += `<div class="lyric-prev">♪ ♫ ♪</div>`;
            html += `<div class="lyric-curr">♪ ♫ ♪</div>`;
          }
          if (state.lyricsData[currIdx + 1]) html += `<div class="lyric-next">${escapeHtml(state.lyricsData[currIdx + 1].text)}</div>`;
          if (state.lyricsData[currIdx + 2]) html += `<div class="lyric-next" style="opacity: 0.4">${escapeHtml(state.lyricsData[currIdx + 2].text)}</div>`;

          el.innerHTML = html;
        }
      }

      // Draw initial scaffold (Two Column Layout)
      printRaw(`
<div class="music-player md" id="${musicId}">
  <div class="lyrics-pane" id="${musicId}-lyrics">
    <div class="lyric-prev">♪ ♫ ♪</div>
    <div class="lyric-curr">Fetching lyrics...</div>
    <div class="lyric-next">♪ ♫ ♪</div>
  </div>
  <div class="info-pane">
    <pre class="cassette" id="${musicId}-cassette">  ╔═════════════╗
┌─╗║   ◉     ◉   ║╗─┐
│ ║║             ║║ │
└─╝║   ◉     ◉   ║╝─┘
  ╚═════════════╝</pre>
    <h2>♫ Into Vishwa's Spotify</h2>
    <p><strong>Track:</strong>&nbsp;&nbsp;&nbsp;<span id="${musicId}-track">Loading...</span></p>
    <p><strong>Artist:</strong>&nbsp;&nbsp;&nbsp;<span id="${musicId}-artist"></span></p>
    <p><strong>Album:</strong>&nbsp;&nbsp;&nbsp;&nbsp;<span id="${musicId}-album"></span></p>
    <div style="margin: 10px 0; display: flex; gap: 8px; flex-wrap: wrap;">
      <button class="composer-btn" id="${musicId}-play-btn">▶ Play</button>
      <button class="composer-btn secondary" id="${musicId}-pause-btn">⏸ Pause</button>
    </div>
    <p class="visualizer" id="${musicId}-eq">▁▁▁▁▁▁▁▁▁▁▁▁</p>
    <p>Progress: [<span id="${musicId}-bar">················</span>]</p>
    <p><span id="${musicId}-time">0:00 / 0:00</span></p>
    <p class="meta" id="${musicId}-status">► Fetching...</p>
  </div>
</div>`);

      // --- Helper: Lyrics ---
      async function fetchLyrics(track, artist, lyricsId) {
        const requestId = ++lyricsRequestId; // snapshot - if a newer request starts before this resolves, we bail

        try {
          let cleanTrack = track.split(' (')[0].split(' [')[0].trim();
          let cleanArtist = artist.split(',')[0].split('&')[0].split(' feat.')[0].trim();

          const res = await fetch(`/api/lyrics?artist=${encodeURIComponent(cleanArtist)}&track=${encodeURIComponent(cleanTrack)}`);

          // A newer fetchLyrics call has since started (song changed again) - discard this stale result
          if (requestId !== lyricsRequestId) return;

          if (!res.ok) throw new Error('API Error');
          const data = await res.json();

          if (requestId !== lyricsRequestId) return; // re-check after the second await

          const el = document.getElementById(lyricsId);

          const parsed = parseLRC(data.synced);
          if (parsed) {
            state.lyricsData = parsed;
            state.lastLyricIdx = -1;
            renderLyrics(0);
          } else if (data.plain) {
            state.lyricsData = null;
            if (el) el.innerHTML = `<div class="lyric-curr">${escapeHtml(data.plain.split('\n').slice(0, 4).join(' '))}</div>`;
          } else {
            state.lyricsData = null;
            if (el) el.innerHTML = `<div class="lyric-curr">Lyrics not found.</div>`;
          }
        } catch (e) {
          if (requestId !== lyricsRequestId) return;
          const el = document.getElementById(lyricsId);
          if (el) el.innerHTML = `<div class="lyric-curr">Failed to fetch lyrics.</div>`;
        }
      }

      // --- Helper: Visualizer ---
      function startVisualizer(eqId, energy, pulseMs) {
        const bars = ['▁', '▂', '▃', '▄', '▅', '▆', '▇', '█'];
        if (state.musicEq) clearInterval(state.musicEq);
        state.musicEq = setInterval(() => {
          let eq = '';
          for (let i = 0; i < 12; i++) {
            // Skew toward taller bars as energy rises, instead of a flat random range
            const r = Math.random() * energy + Math.random() * (1 - energy) * 0.3;
            const idx = Math.min(bars.length - 1, Math.floor(r * bars.length));
            eq += bars[idx];
          }
          const el = document.getElementById(eqId);
          if (el) el.textContent = eq;
          else clearInterval(state.musicEq);
        }, pulseMs);
      }
      function stopVisualizer(eqId) {
        if (state.musicEq) clearInterval(state.musicEq);
        state.musicEq = null;
        const el = document.getElementById(eqId);
        if (el) el.textContent = '▁▁▁▁▁▁▁▁▁▁▁▁';
      }

      // --- Helper: Spinning Cassette ---
      function startCassette(casId, pulseMs) {
        const reels = ['◉', '◎', '○', '◎'];
        let idx = 0;
        if (state.musicCassette) clearInterval(state.musicCassette);
        state.musicCassette = setInterval(() => {
          const el = document.getElementById(casId);
          if (!el) { clearInterval(state.musicCassette); return; }
          const r = reels[idx % 4];
          el.textContent = `  ╔═════════════╗
┌─╗║   ${r}     ${r}   ║╗─┐
│ ║║             ║║ │
└─╝║   ${r}     ${r}   ║╝─┘
  ╚═════════════╝`;
          idx++;
        }, Math.round(pulseMs * 1.6)); // reels turn slower than the EQ pulses, stays readable
      }
      function stopCassette(casId) {
        if (state.musicCassette) clearInterval(state.musicCassette);
        state.musicCassette = null;
        const el = document.getElementById(casId);
        if (el) el.textContent = `  ╔═════════════╗
┌─╗║   ◉     ◉   ║╗─┐
│ ║║             ║║ │
└─╝║   ◉     ◉   ║╝─┘
  ╚═════════════╝`;
      }

      // --- Helper: Idle / sleep state ---
      // If nothing's played for a while, dim the panel instead of leaving it looking
      // "live" forever on a stalled/paused session.
      function setStatus(text) {
        const statusEl = document.getElementById(`${musicId}-status`);
        if (statusEl) statusEl.textContent = isIdle ? `${text}   z z z` : text;
      }
      function applyIdleVisual(active) {
        const el = document.getElementById(musicId);
        if (!el) return;
        const infoPane = el.querySelector('.info-pane');
        if (infoPane) infoPane.style.opacity = active ? '0.45' : '1';
      }
      function scheduleIdle() {
        if (state.musicIdleTimer || isIdle) return;
        state.musicIdleTimer = setTimeout(() => {
          isIdle = true;
          state.musicIdleTimer = null;
          applyIdleVisual(true);
        }, IDLE_THRESHOLD_MS);
      }
      function cancelIdle() {
        if (state.musicIdleTimer) { clearTimeout(state.musicIdleTimer); state.musicIdleTimer = null; }
        if (isIdle) { isIdle = false; applyIdleVisual(false); }
      }

      // --- Play/Pause Controls ---
      document.getElementById(`${musicId}-play-btn`).addEventListener('click', async () => {
        try {
          await fetch('/api/spotify/play', { method: 'PUT' });
          fetchAndUpdate(); // Force an immediate sync after clicking
        } catch (e) { console.error('Play error:', e); }
      });

      document.getElementById(`${musicId}-pause-btn`).addEventListener('click', async () => {
        try {
          await fetch('/api/spotify/pause', { method: 'PUT' });
          fetchAndUpdate(); // Force an immediate sync after clicking
        } catch (e) { console.error('Pause error:', e); }
      });

      // --- Main Sync Loop ---
      async function fetchAndUpdate() {
        try {
          const res = await fetch('/api/spotify');
          if (!res.ok) return;
          const data = await res.json();

          const el = document.getElementById(musicId);
          if (!el) {
            clearInterval(state.musicPoll); clearInterval(state.musicTick);
            clearInterval(state.musicEq); clearInterval(state.musicCassette);
            state.musicPoll = state.musicTick = state.musicEq = state.musicCassette = null;
            return;
          }

          const hasTrack = Boolean(data.track);

          if (hasTrack && data.track !== currentTrack) {
            currentTrack = data.track;
            trackProfile = getTrackProfile(data.track, data.artist);
            state.lyricsData = null;
            state.lastLyricIdx = -1;
            document.getElementById(`${musicId}-track`).textContent = data.track;
            document.getElementById(`${musicId}-artist`).textContent = data.artist;
            document.getElementById(`${musicId}-album`).textContent = data.album;

            fetchLyrics(data.track, data.artist, `${musicId}-lyrics`);
          } else if (!hasTrack && currentTrack !== null) {
            // Playback stopped entirely / no track info from the API - don't try to fetch lyrics for "undefined"
            currentTrack = null;
            lyricsRequestId++; // invalidate any in-flight lyrics request
            state.lyricsData = null;
            state.lastLyricIdx = -1;
          }

          if (data.isPlaying) {
            cancelIdle();
            document.getElementById(`${musicId}-bar`).textContent = progressBar(data.progress_ms / data.duration_ms);
            document.getElementById(`${musicId}-time`).textContent = `${fmtTime(data.progress_ms)} / ${fmtTime(data.duration_ms)}`;
            setStatus(`► Currently playing ${data.device ? 'on ' + data.device : ''}`);

            startVisualizer(`${musicId}-eq`, trackProfile.energy, trackProfile.pulseMs);
            startCassette(`${musicId}-cassette`, trackProfile.pulseMs);
            renderLyrics(data.progress_ms);

            // Always re-anchor the ticker to the server's authoritative position on every poll.
            // This is what actually fixes desync on skip/seek: instead of trying to detect every
            // way the track could have changed, we just never let the ticker run stale for more
            // than one poll interval (5s) against outdated duration/position data.
            if (state.musicTick) { clearInterval(state.musicTick); state.musicTick = null; }

            let localMs = data.progress_ms;
            const durationMs = data.duration_ms;
            state.musicTick = setInterval(() => {
              localMs += 1000;
              if (localMs >= durationMs) {
                clearInterval(state.musicTick); state.musicTick = null;
                fetchAndUpdate();
                return;
              }
              document.getElementById(`${musicId}-bar`).textContent = progressBar(localMs / durationMs);
              document.getElementById(`${musicId}-time`).textContent = `${fmtTime(localMs)} / ${fmtTime(durationMs)}`;
              renderLyrics(localMs);
            }, 1000);
          } else if (data.progress_ms !== undefined) {
            if (state.musicTick) { clearInterval(state.musicTick); state.musicTick = null; }
            stopVisualizer(`${musicId}-eq`);
            stopCassette(`${musicId}-cassette`);

            document.getElementById(`${musicId}-bar`).textContent = progressBar(data.progress_ms / data.duration_ms);
            document.getElementById(`${musicId}-time`).textContent = `${fmtTime(data.progress_ms)} / ${fmtTime(data.duration_ms)}`;
            setStatus(`► Paused ${data.device ? 'on ' + data.device : ''}`);
            renderLyrics(data.progress_ms);
            scheduleIdle();
          } else {
            if (state.musicTick) { clearInterval(state.musicTick); state.musicTick = null; }
            stopVisualizer(`${musicId}-eq`);
            stopCassette(`${musicId}-cassette`);
            setStatus(`► Played ${data.played_ago || 'recently'}`);
            scheduleIdle();
            const lEl = document.getElementById(`${musicId}-lyrics`);
            if (lEl && state.lyricsData === null) lEl.innerHTML = `<div class="lyric-curr">Press play to see lyrics...</div>`;
          }
        } catch (e) {
          console.error('Sync error:', e);
        }
      }

      await fetchAndUpdate();
      state.musicPoll = setInterval(fetchAndUpdate, 5000);
    }

    // ----- Tab completion & Markdown (unchanged) -----
    function getCompletionTargets() {
      const files = getFilesInCwd(); const names = files.map(f => f.name.replace(/\/$/, ''));
      if (state.cwd === '~') return [...names, ...TOPICS, 'projects', 'experience'];
      if (state.cwd === '~/projects') return PROJECTS.map(p => p.name);
      return [...names];
    }
    function longestCommonPrefix(arr) {
      if (arr.length === 0) return ''; let prefix = arr[0];
      for (let i = 1; i < arr.length; i++) {
        while (arr[i].indexOf(prefix) !== 0) { prefix = prefix.slice(0, -1); if (prefix.length === 0) return ''; }
      }
      return prefix;
    }
    function tabComplete() {
      if (state.input.length === 0) return;
      const parts = state.input.split(/\s+/); const last = parts[parts.length - 1];
      if (parts.length === 1) {
        const cmds = Object.keys(commands).filter(c => c.startsWith(last));
        if (cmds.length === 1) { state.input = cmds[0] + ' '; state.ghostText = ''; renderInput(); playKeyClick(); }
        else if (cmds.length > 1) {
          const common = longestCommonPrefix(cmds);
          if (common.length > last.length) { state.ghostText = common.slice(last.length); }
          else { print(`<span class="text-dim">${escapeHtml(state.input)}</span>`); print(cmds.map(c => `  <span class="text-info">${c}</span>`).join('  ')); state.ghostText = ''; }
          renderInput();
        } return;
      }
      const targets = getCompletionTargets();
      const matches = targets.filter(t => t.toLowerCase().startsWith(last.toLowerCase()));
      if (matches.length === 1) {
        const m = matches[0];
        if (state.ghostText && state.input + state.ghostText === m) { state.input = m; state.ghostText = ''; }
        else { parts[parts.length - 1] = m; state.input = parts.join(' '); state.ghostText = ''; }
        renderInput(); playKeyClick();
      } else if (matches.length > 1) {
        const common = longestCommonPrefix(matches);
        if (common.length > last.length) {
          if (state.ghostText && state.input + state.ghostText === common) { parts[parts.length - 1] = common; state.input = parts.join(' '); state.ghostText = ''; }
          else { state.ghostText = common.slice(last.length); }
        } else {
          print(`<span class="text-dim">${escapeHtml(state.input)}</span>`);
          print(matches.map(m => `  <span class="text-info">${escapeHtml(m)}</span>`).join('  '));
          state.ghostText = '';
        }
        renderInput();
      } else { state.ghostText = ''; renderInput(); playBeep(); }
    }
    function renderMarkdown(text) {
      const lines = text.split('\n'); let html = '';
      let inCode = false, inList = false, inOrdered = false; let codeBuffer = [];
      function closeList() { if (inList) { html += inOrdered ? '</ol>' : '</ul>'; inList = false; inOrdered = false; } }
      for (const line of lines) {
        if (line.startsWith('```')) {
          if (inCode) { html += `<pre><code>${escapeHtml(codeBuffer.join('\n'))}</code></pre>`; codeBuffer = []; inCode = false; }
          else { closeList(); inCode = true; }
          continue;
        }
        if (inCode) { codeBuffer.push(line); continue; }
        if (line.startsWith('# ')) { closeList(); html += `<h1>${inline(line.slice(2))}</h1>`; }
        else if (line.startsWith('## ')) { closeList(); html += `<h2>${inline(line.slice(3))}</h2>`; }
        else if (line.startsWith('### ')) { closeList(); html += `<h3>${inline(line.slice(4))}</h3>`; }
        else if (/^\d+\.\s/.test(line)) {
          if (!inList || !inOrdered) { closeList(); html += '<ol>'; inList = true; inOrdered = true; }
          html += `<li>${inline(line.replace(/^\d+\.\s/, ''))}</li>`;
        } else if (line.startsWith('- ') || line.startsWith('* ')) {
          if (!inList || inOrdered) { closeList(); html += '<ul>'; inList = true; inOrdered = false; }
          html += `<li>${inline(line.slice(2))}</li>`;
        } else if (line.startsWith('> ')) { closeList(); html += `<blockquote>${inline(line.slice(2))}</blockquote>`; }
        else if (line.trim() === '---') { closeList(); html += '<hr>'; }
        else if (line.trim() === '') { closeList(); }
        else { closeList(); html += `<p>${inline(line)}</p>`; }
      }
      closeList();
      if (inCode) html += `<pre><code>${escapeHtml(codeBuffer.join('\n'))}</code></pre>`;
      return html;
    }
    function inline(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }

    async function executeCommand() {
      if (state.ghostText) { state.input += state.ghostText; state.ghostText = ''; }
      const cmd = state.input.trim();
      if (state.phase === 'lock') { await executeLockCommand(cmd); return; }
      print(`<span class="prompt-user">vishwa</span><span class="prompt-sep">@</span><span class="prompt-host">portfolio</span><span class="prompt-sep">:</span><span class="prompt-path">${escapeHtml(state.cwd)}</span><span class="prompt-sep">$</span> ${escapeHtml(cmd)}`);
      state.input = '';
      if (cmd) {
        state.history.push(cmd); state.historyIdx = state.history.length;
        const chain = cmd.split('&&').map(s => s.trim()).filter(Boolean);
        for (const sub of chain) {
          const parts = sub.split(/\s+/); const name = parts[0]; const args = parts.slice(1);
          if (commands[name]) { try { commands[name](args); } catch (e) { print(`<span class="text-error">error: ${escapeHtml(e.message)}</span>`); } }
          else { print(`<span class="text-error">command not found: ${escapeHtml(name)}</span>`); print('<span class="text-dim">type \'help\' for available commands</span>'); break; }
        }
      }
      renderInput(); scrollToEnd();
    }
    function typeChar(ch) {
      if (state.ghostText) { state.input += state.ghostText; state.ghostText = ''; }
      state.input += ch; renderInput(); playKeyClick();
    }
    function backspace() {
      if (state.ghostText) { state.ghostText = ''; renderInput(); playKeyClick(); return; }
      if (state.input.length > 0) { state.input = state.input.slice(0, -1); renderInput(); playKeyClick(); }
    }
    function historyPrev() {
      if (state.history.length === 0) return;
      if (state.historyIdx > 0) { state.historyIdx--; state.input = state.history[state.historyIdx]; state.ghostText = ''; renderInput(); playKeyClick(); }
    }
    function historyNext() {
      if (state.history.length === 0) return;
      if (state.historyIdx < state.history.length - 1) { state.historyIdx++; state.input = state.history[state.historyIdx]; }
      else { state.historyIdx = state.history.length; state.input = ''; }
      state.ghostText = ''; renderInput(); playKeyClick();
    }
    function handleKeydown(e) {
      if (state.phase === 'unlocking' || state.phase === 'boot') return;
      const active = document.activeElement;
      if (active && active !== $hiddenInput && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
      if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) { e.preventDefault(); cmdClear(); return; }
      if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
        e.preventDefault();
        if (state.input.length > 0 || state.ghostText.length > 0) {
          const shown = state.input + state.ghostText;
          if (state.phase === 'lock') print(`<span class="prompt-guest">┌──(guest@vishwa)-[~/portfolio]</span><br><span class="prompt-guest">└─$</span> ${escapeHtml(shown)}<span class="text-error">^C</span>`);
          else print(`<span class="prompt-user">vishwa</span><span class="prompt-sep">@</span><span class="prompt-host">portfolio</span><span class="prompt-sep">:</span><span class="prompt-path">${escapeHtml(state.cwd)}</span><span class="prompt-sep">$</span> ${escapeHtml(shown)}<span class="text-error">^C</span>`);
          state.input = ''; state.ghostText = ''; renderInput();
        } return;
      }
      if (e.key === 'Enter') { e.preventDefault(); executeCommand(); return; }
      if (e.key === 'Backspace') { e.preventDefault(); backspace(); return; }
      if (e.key === 'Tab') { e.preventDefault(); if (state.phase === 'unlocked') tabComplete(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); historyPrev(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); historyNext(); return; }
      if (e.key === 'Home' || e.key === 'End' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); return; }
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault(); typeChar(e.key); if ($hiddenInput) $hiddenInput.value = '';
      }
    }

    async function lockSequence() {
      state.phase = 'lock'; state.attempts = 0; updatePrompt();
      await sleep(800);

      print('<span class="text-dim">vishwa-os 5.15.0-portfolio #1 SMP</span>');
      await sleep(300);
      print('<span class="text-dim">[ OK ] Mounting /dev/portfolio...</span>');
      await sleep(250);
      print('<span class="text-dim">[ OK ] Initializing CRT phosphor emulation...</span>');
      await sleep(250);
      print('<span class="text-dim">[ OK ] System integrity check passed.</span>');
      await sleep(400);
      print('');
      print('<span class="text-bright">SYSTEM LOCKED</span>');
      await sleep(400);
      print('<span class="text-dim">> 4-digit access key required to spawn root shell.</span>');
      await sleep(300);
      print('<span class="text-dim">> Brute force the key. Use: crack <4-digits></span>');
      print('');
    }

    async function bootSequence() {
      state.phase = 'boot'; updatePrompt();
      const banner = `██╗   ██╗██╗███████╗██╗  ██╗██╗    ██╗ █████╗ 
██║   ██║██║██╔════╝██║  ██║██║    ██║██╔══██╗
██║   ██║██║███████╗███████║██║ █╗ ██║███████║
╚██╗ ██╔╝██║╚════██║██╔══██║██║███╗██║██╔══██║
 ╚████╔╝ ██║███████║██║  ██║╚███╔███╔╝██║  ██║
  ╚═══╝  ╚═╝╚══════╝╚═╝  ╚═╝ ╚══╝╚══╝ ╚═╝  ╚═╝`;
      printRaw(`<pre class="ascii-banner">${banner}</pre>`);
      print('<span class="text-dim">— portfolio OS v3.0 · interactive shell —</span>'); print(''); await sleep(150);
      const bootLines = [
        { text: '[ <span class="text-success">OK</span> ] Initializing portfolio OS v3.0...', delay: 120 },
        { text: '[ <span class="text-success">OK</span> ] Mounting /dev/keyboard → /dev/input', delay: 110 },
        { text: '[ <span class="text-success">OK</span> ] Mounting /dev/screen → /dev/tty1', delay: 110 },
        { text: '[ <span class="text-success">OK</span> ] Loading character ROM... 256 glyphs', delay: 140 },
        { text: '[ <span class="text-success">OK</span> ] Initializing phosphor decay simulation', delay: 130 },
        { text: `[ <span class="text-info">..</span> ] Loading profile: ${escapeHtml(ABOUT.name)}`, delay: 120 },
        { text: `[ <span class="text-info">..</span> ] Loading projects: ${PROJECTS.length} entries`, delay: 120 },
        { text: `[ <span class="text-info">..</span> ] Loading experience: ${EXPERIENCE.length} role(s)`, delay: 120 },
        { text: '[ <span class="text-success">OK</span> ] Calibrating CRT scanline generator', delay: 130 },
        { text: '[ <span class="text-success">OK</span> ] Starting interactive shell (bash 5.2.15)', delay: 180 },
      ];
      for (const line of bootLines) { print(line.text); await sleep(line.delay); }
      await sleep(180); print('');
      print(`<span class="text-bright">Welcome to portfolio OS v3.0 — ${escapeHtml(ABOUT.name)}</span>`);
      print(`<span class="text-dim">${escapeHtml(ABOUT.role)}</span>`);
      print('<span class="text-dim">Type \'help\' to see available commands. Type \'whoami\' for summary. Type \'resume\' for full CV.</span>');
      print('<span class="text-dim">Tab completes. Up/Down arrows cycle history. Ctrl+L clears. Try: ls, cd projects, cat about.md</span>');
      print(''); print(`<span class="text-dim">— last login: never · session #${Math.floor(Math.random() * 9000 + 1000)} —</span>`); print('');
      state.phase = 'unlocked'; state.history = []; state.historyIdx = -1; renderInput();
    }

    function updateClock() {
      const d = new Date(); const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0'); const s = String(d.getSeconds()).padStart(2, '0');
      if ($statusClock) $statusClock.textContent = `${h}:${m}:${s}`;
    }

    function init() {
      document.addEventListener('keydown', handleKeydown);
      if ($hiddenInput) {
        $hiddenInput.addEventListener('input', (e) => {
          const val = e.target.value;
          if (val && state.phase !== 'unlocking' && state.phase !== 'boot') {
            for (const ch of val) { if (ch.length === 1) typeChar(ch); }
            e.target.value = '';
          }
        });
        $hiddenInput.addEventListener('keydown', (e) => {
          if (['Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
        });
      }
      $terminal.addEventListener('click', (e) => {
        if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if ($hiddenInput) $hiddenInput.focus({ preventScroll: true });
      });
      if ($hiddenInput) $hiddenInput.focus({ preventScroll: true });
      document.addEventListener('click', (e) => {
        if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if ($hiddenInput) $hiddenInput.focus({ preventScroll: true });
      });
      updateClock(); setInterval(updateClock, 1000);
      lockSequence();
    }

    init();
  </script>
